name: Package native CLI
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install musl linker
        if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure musl linker
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "musl-gcc"\n' '${{ matrix.target }}' > .cargo/config.toml
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test the native command and compiler worker on matching hosts
        shell: bash
        env:
          REFQUILL_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/refquill${{ startsWith(matrix.platform, 'win32-') && '.exe' || '' }}
        run: |
          host=$(node -p 'process.platform + "-" + process.arch')
          test "$host" = '${{ matrix.platform }}'
          node --test tests/cli.test.mjs tests/typescript-paths.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/refquill${{ startsWith(matrix.platform, 'win32-') && '.exe' || '' }}
          if-no-files-found: error
  packages:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{darwin,linux,win32}-*'
          path: .release/binaries
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickwelsh/refquill-fumadocs build
      - run: pnpm release:pack
      - name: Record release checksums
        working-directory: .release/packages
        run: sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: .release/packages/
          if-no-files-found: error
  consumers:
    name: Verify installed packages (${{ matrix.platform }}, Node ${{ matrix.node-version || '24' }})
    needs: packages
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2025
            platform: win32-x64
          # Exercise the declared minimum runtime as well as the release runtime.
          - runner: ubuntu-24.04
            platform: linux-x64
            node-version: '22.18.0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version || '24' }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: .release/packages
      - name: Verify host architecture and exact release checksums
        shell: bash
        run: |
          host=$(node -p 'process.platform + "-" + process.arch')
          test "$host" = '${{ matrix.platform }}'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          for (const line of readFileSync('.release/packages/SHA256SUMS', 'utf8').trim().split('\n')) {
            const [expected, file] = line.split(/\s+/);
            const actual = createHash('sha256').update(readFileSync(`.release/packages/${file}`)).digest('hex');
            assert.equal(actual, expected, `Release checksum mismatch: ${file}`);
          }
          NODE
      - name: Install and exercise all analyzers and renderers in isolation
        run: node scripts/test-release.mjs
